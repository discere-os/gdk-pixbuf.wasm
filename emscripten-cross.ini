[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkgconfig = 'em-pkg-config'

[built-in options]
c_std = 'gnu99'
default_library = 'static'
c_args = []
cpp_args = []
c_link_args = []
cpp_link_args = []

[properties]
sizeof_void_p = 4
sizeof_wchar_t = 4
# sys_root will be auto-detected by emcc
needs_exe_wrapper = true

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
